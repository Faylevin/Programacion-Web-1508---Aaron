<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="index :: head">
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="index :: navbar"> </nav>
<h1>Artista</h1>
<h1 th:text="${artista.nombre}"></h1>
<p th:text="${artista.genero}"></p>
<div class="d-flex justify-content-center my-4">
<div class="card" style="width: 18rem;">
    <img class="card-img-top" src="https://i.imgur.com/Pd8HcrX.jpeg" alt="Card image cap">
    <div class="card-body">
        <h5 class="card-title" th:text="${artista.nombre}">Card title</h5>
        <p class="card-text" th:text="${artista.descripcion}">Some quick example text to build on the card title and make up the bulk of the card's content.</p>
        <a href="#" class="btn btn-primary">Go somewhere</a>
    </div>
</div>
</div>
<div th:replace="index :: jsincludes">
</div>
<footer th:replace="index :: footer"></footer>
</body>
</html>
