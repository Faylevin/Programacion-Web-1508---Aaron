<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Formulario</title>
</head>
<body>


<div class="container mt-5">
    <p class="text-success" th:if="${param.exito}">Mascota agregada exitosamente</p>
    <hr>

    <form th:action="@{/veterinaria/guardar}" th:object="${animal}" th:method="post">

        <div class="input-group mb-3">
            <span class="input-group-text" id="nombre-label">Nombre</span>
            <input type="text" id="nombre" name="nombre" th:field="*{nombre}" class="form-control" placeholder="Nombre de la mascota" aria-label="Nombre" aria-describedby="nombre-label">
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text" id="especie-label">Especie</span>
            <input type="text" id="especie" name="especie" th:field="*{especie}" class="form-control" placeholder="Ej: Perro, Gato..." aria-label="Especie" aria-describedby="especie-label">
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text" id="raza-label">Raza</span>
            <input type="text" id="raza" name="raza" th:field="*{raza}" class="form-control" placeholder="Ej: Labrador, Persa..." aria-label="Raza" aria-describedby="raza-label">
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text">Edad</span>
            <input type="text" id="edad" name="edad" th:field="*{edad}" class="form-control" placeholder="Edad en años" aria-label="Edad">
            <span class="input-group-text">años</span>
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text">Peso</span>
            <input type="text" id="peso" name="peso" th:field="*{peso}" class="form-control" placeholder="Peso de la mascota" aria-label="Peso">
            <span class="input-group-text">kg</span>
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text" id="imagen-label">Imagen</span>
            <input type="text" id="imagen" name="imagen" th:field="*{imagen}" class="form-control" placeholder="URL de la imagen" aria-label="Imagen" aria-describedby="imagen-label">
        </div>

        <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
</div>

<div th:replace="index :: jsincludes">

</div>

</body>
</html>
